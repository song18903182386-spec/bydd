<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>河北白云朵朵广告有限公司</title>
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:Microsoft YaHei,sans-serif;}
        body {line-height:1.8;color:#333;background:#f5f6f8;scroll-behavior:smooth;}
        ul{list-style:none;}a{text-decoration:none;color:inherit;}
        .container{max-width:1200px;margin:0 auto;padding:0 20px;}
        .section{padding:80px 0;}
        .section-title{text-align:center;font-size:32px;color:#0a3474;margin-bottom:40px;font-weight:600;}

        .header{position:fixed;top:0;left:0;width:100%;z-index:999;padding:15px 0;background:rgba(10,52,116,0.3);}
        .nav-wrap{display:flex;justify-content:space-between;align-items:center;}
        .logo{display:flex;align-items:center;gap:12px;color:#fff;font-size:18px;font-weight:bold;}
        .logo img{height:30px;}

        .hero{width:100%;height:100vh;position:relative;overflow:hidden;}
        .hero-slide{position:absolute;width:100%;height:100%;opacity:0;transition:opacity 1s;}
        .hero-slide.active{opacity:1;}
        .hero-slide img{width:100%;height:100%;object-fit:cover;}
        .hero-mask{position:absolute;inset:0;background:rgba(10,52,116,0.65);}
        .hero-content{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;color:#fff;width:90%;}
        .hero-logo{height:120px;margin-bottom:10px;}

        .service{background:#fff;}
        .service-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:25px;}
        .service-card{background:#f8f9fa;border-radius:8px;overflow:hidden;cursor:pointer;transition:0.3s;}
        .service-card:hover{transform:translateY(-6px);box-shadow:0 8px 20px rgba(10,52,116,0.1);}
        .card-cover{width:100%;height:180px;object-fit:cover;}
        .card-text{padding:20px;text-align:center;}
        .service-card h3{color:#0a3474;font-size:20px;margin-bottom:8px;}
        .service-card p{color:#555;font-size:15px;}

        .album-modal{position:fixed;inset:0;background:rgba(0,0,0,0.9);z-index:9999;padding:40px 20px;display:none;overflow-y:auto;}
        .modal-close{position:fixed;top:20px;right:40px;color:#fff;font-size:40px;cursor:pointer;}
        .album-title{color:#fff;text-align:center;font-size:28px;margin-bottom:30px;}
        .album-grid{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:15px;}
        .album-grid img{width:100%;height:180px;object-fit:cover;border-radius:6px;}

        @media(max-width:768px){
            .service-grid{grid-template-columns:1fr;}
            .album-grid{grid-template-columns:repeat(2,1fr);}
        }
    </style>
</head>
<body>

<header class="header">
    <div class="container nav-wrap">
        <div class="logo">
            <img src="images/logo.png" alt="logo">
            河北白云朵朵广告有限公司
        </div>
    </div>
</header>

<section class="hero">
    <div class="hero-slide active"><img src="images/banner01.jpg"></div>
    <div class="hero-mask"></div>
    <div class="hero-content">
        <img src="images/logo.png" class="hero-logo">
        <h1>创意与品质并重，设计与落地同行</h1>
    </div>
</section>

<section class="section service">
    <div class="container">
        <h2 class="section-title">我们能为您做什么</h2>
        <div class="service-grid">

            <div class="service-card" data-type="led">
                <img class="card-cover" src="images/LED显示工程.jpg">
                <div class="card-text"><h3>LED显示工程</h3><p>室内大屏、户外全彩屏</p></div>
            </div>

            <div class="service-card" data-type="sign">
                <img class="card-cover" src="images/标牌其它.jpg">
                <div class="card-text"><h3>广告标识工程</h3><p>标牌、精神堡垒、科室牌</p></div>
            </div>

            <div class="service-card" data-type="guide">
                <img class="card-cover" src="images/标识导示.jpg">
                <div class="card-text"><h3>标识导示</h3><p>导视牌、楼层索引、指示牌</p></div>
            </div>

            <div class="service-card" data-type="party">
                <img class="card-cover" src="images/党建文化.jpg">
                <div class="card-text"><h3>党建文化建设</h3><p>党建展厅、文化墙、长廊</p></div>
            </div>

            <div class="service-card" data-type="lightbox">
                <img class="card-cover" src="images/灯箱发光字.jpg">
                <div class="card-text"><h3>灯箱发光字</h3><p>发光字、灯箱、门头招牌</p></div>
            </div>

            <div class="service-card" data-type="light">
                <img class="card-cover" src="images/亮化工程.jpg">
                <div class="card-text"><h3>亮化工程</h3><p>楼宇亮化、景观照明</p></div>
            </div>

            <div class="service-card" data-type="aluminum">
                <img class="card-cover" src="images/铝板幕墙.jpg">
                <div class="card-text"><h3>铝单板幕墙</h3><p>外墙装饰、冲孔铝板</p></div>
            </div>

            <div class="service-card" data-type="store">
                <img class="card-cover" src="images/门头店招.jpg">
                <div class="card-text"><h3>门头店招</h3><p>商铺门头、形象墙</p></div>
            </div>

            <div class="service-card" data-type="culture">
                <img class="card-cover" src="images/企业文化.jpg">
                <div class="card-text"><h3>企业文化建设</h3><p>文化墙、展厅、宣传栏</p></div>
            </div>

            <div class="service-card" data-type="school">
                <img class="card-cover" src="images/校园文化.jpg">
                <div class="card-text"><h3>校园文化建设</h3><p>校园文化、展板、雕塑</p></div>
            </div>

            <div class="service-card" data-type="material">
                <img class="card-cover" src="images/宣传物料.jpg">
                <div class="card-text"><h3>宣传物料</h3><p>展架、画册、宣传单</p></div>
            </div>

        </div>
    </div>
</section>

<div class="album-modal" id="albumModal">
    <span class="modal-close">×</span>
    <h2 class="album-title"></h2>
    <div class="album-grid"></div>
</div>

<script>
const allAlbum = {
    led: {title:"LED显示工程",list:Array.from({length:27},(_,i)=>`images/LED显示工程/ping (${i+1}).jpg`)},
    sign: {title:"广告标识工程",list:Array.from({length:35},(_,i)=>`images/标牌其它/pai (${i+1}).jpg`)},
    guide: {title:"标识导示",list:Array.from({length:35},(_,i)=>`images/标识导示/biao (${i+1}).jpg`)},
    party: {title:"党建文化建设",list:Array.from({length:13},(_,i)=>`images/党建文化/dang (${i+1}).jpg`)},
    lightbox: {title:"灯箱发光字",list:Array.from({length:40},(_,i)=>`images/灯箱发光字/zi (${i+1}).jpg`)},
    light: {title:"亮化工程",list:Array.from({length:44},(_,i)=>`images/亮化工程/lianghua (${i+1}).jpg`)},
    aluminum: {title:"铝单板幕墙",list:Array.from({length:39},(_,i)=>`images/铝板幕墙/lvban (${i+1}).jpg`)},
    store: {title:"门头店招",list:Array.from({length:40},(_,i)=>`images/门头店招/mentou (${i+1}).jpg`)},
    culture: {title:"企业文化建设",list:Array.from({length:49},(_,i)=>`images/企业文化/qiye (${i+1}).jpg`)},
    school: {title:"校园文化建设",list:Array.from({length:67},(_,i)=>`images/校园文化/xiao (${i+1}).jpg`)},
    material: {title:"宣传物料",list:Array.from({length:11},(_,i)=>`images/宣传物料/xuan (${i+1}).jpg`)}
};

const cards = document.querySelectorAll(".service-card");
const modal = document.getElementById("albumModal");
const close = document.querySelector(".modal-close");
const title = document.querySelector(".album-title");
const box = document.querySelector(".album-grid");

cards.forEach(c=>{
    c.onclick=()=>{
        const d=allAlbum[c.dataset.type];
        title.innerText=d.title;
        box.innerHTML="";
        d.list.forEach(s=>{
            const img=document.createElement("img");
            img.src=s;
            box.appendChild(img);
        });
        modal.style.display="block";
    }
});

close.onclick=()=>{modal.style.display="none";}
modal.onclick=(e)=>{if(e.target===modal)modal.style.display="none";}
</script>
</body>
</html>
